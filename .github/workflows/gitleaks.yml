name: Secret scan

# Runs the gitleaks binary directly rather than gitleaks-action, which has no
# license declared and needs a key for organisation repositories. The release
# is pinned by version and by SHA-256, so a swapped download fails the job.
# Settings, including the three accepted Firebase web keys, are in
# .gitleaks.toml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: Tree and history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the scan covers every commit, not just the tip.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks version

      - name: Scan the working tree
        run: ./gitleaks dir . --config .gitleaks.toml --redact --no-banner

      - name: Scan the commit history
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner
