[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lmucs"
version = "1.0.0"
description = "Reads and validates the LMU computer science course record."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Patrick King" }]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
lmucs = "lmucs.cli:main"

[tool.setuptools.packages.find]
include = ["lmucs*"]
