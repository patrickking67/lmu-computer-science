# The deployment environment must be named `github-pages`: that name is reserved
# by GitHub and `actions/deploy-pages` will not deploy to any other. The display
# name in the Deployments list comes from it and cannot be changed to
# "GitHub Pages" without breaking the deploy. What is nameable is the workflow
# and its jobs, so those read cleanly instead.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead, and don't cancel one in flight.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/dashboard/package-lock.json

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: src/dashboard
        run: npm ci

      - name: Build
        working-directory: src/dashboard
        env:
          # configure-pages resolves both, so the same source builds correctly
          # whether this is served at a domain root or a project subpath.
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PUBLIC_CONTACT_ENDPOINT: ${{ vars.CONTACT_ENDPOINT }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/dashboard/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
