name: Python package (Conda)

on:
  push:
    branches: [main]
    paths: ['src/packages/**', 'src/courses/**', '.github/workflows/python-package-conda.yml']
  pull_request:
    paths: ['src/packages/**', 'src/courses/**', '.github/workflows/python-package-conda.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    defaults:
      run:
        shell: bash -el {0}   # -l so the conda env activation takes effect

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python-version }}
          miniforge-version: latest
          activate-environment: lmucs
          auto-activate-base: false

      - name: Install the package and its test dependencies
        working-directory: src/packages/lmucs
        run: |
          conda install -y pytest
          python -m pip install --no-build-isolation -e .

      - name: Lint
        working-directory: src/packages/lmucs
        run: |
          conda install -y flake8
          # Syntax errors and undefined names fail the build; style is advisory.
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

      - name: Test
        working-directory: src/packages/lmucs
        run: pytest -q

      - name: Verify the record against the tree
        run: |
          lmucs verify
          lmucs stats
