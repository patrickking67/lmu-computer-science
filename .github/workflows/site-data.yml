name: Site data

# The dashboard makes checkable claims about this repository: that a program
# lives at a path, that a snippet quotes real lines, that the published line
# counts are current. Any of those can rot without breaking the build, so they
# are tested rather than trusted.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Data matches the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/dashboard/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install lmucs and pytest
        # Build isolation on purpose: unlike the conda job, this runner has no
        # setuptools of its own, so pip has to fetch the build backend itself.
        run: python -m pip install -e src/packages/lmucs pytest

      - name: Install site dependencies
        working-directory: src/dashboard
        run: npm ci --no-audit --no-fund

      - name: Check, test and build
        # The same command a contributor runs locally: the repository check,
        # the site-data tests (a glob, since node --test <dir> fails; type
        # stripping needs no flag on Node 22.18 and later, which is why the .ts
        # data files import), the lmucs tests, and the site build. Running the
        # one script here is what keeps it honest.
        run: ./scripts/check.sh
