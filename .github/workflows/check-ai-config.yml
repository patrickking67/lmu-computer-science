name: AI configuration check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The check only reads the tree. Leaving the job's token in
          # .git/config lets any later step push with it.
          persist-credentials: false
      - name: Validate repository configuration
        run: ./scripts/check-ai-config.sh
